name: Publish to Stores

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish to stores'
        required: true
      chrome:
        description: 'Publish to Chrome Web Store'
        type: boolean
        default: true
      firefox:
        description: 'Publish to Firefox Add-Ons'
        type: boolean
        default: true
      edge:
        description: 'Publish to Edge Add-ons'
        type: boolean
        default: true
      upload-only:
        description: 'Upload only'
        type: boolean
        default: false

jobs:
  ci:
    name: CI
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.event.release.tag_name }}

  build:
    name: Build
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build zips
        run: pnpm zip && pnpm zip:firefox

      - name: Upload zips
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zips
          path: .output/*.zip
          if-no-files-found: error
          include-hidden-files: true

  submit:
    name: Submit to Stores
    needs: build
    runs-on: ubuntu-latest
    env:
      CHROME: ${{ github.event_name == 'release' || inputs.chrome }}
      FIREFOX: ${{ github.event_name == 'release' || inputs.firefox }}
      EDGE: ${{ github.event_name == 'release' || inputs.edge }}
      PUBLISH: ${{ github.event_name == 'release' || !inputs.upload-only }}
    steps:
      - name: Download zips
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zips
          path: .output/

      - name: Resolve zip paths
        id: zips
        run: |
          echo "chrome=$(ls .output/*-chrome.zip)" >> "$GITHUB_OUTPUT"
          echo "firefox=$(ls .output/*-firefox.zip)" >> "$GITHUB_OUTPUT"

      - name: Publish to stores
        uses: creeperkatze/extension-publish@797030bc8a9f26541989b92ee174151f36e12975 # v1.1.1
        with:
          chrome-client-id: ${{ env.CHROME == 'true' && secrets.CHROME_CLIENT_ID || '' }}
          chrome-client-secret: ${{ env.CHROME == 'true' && secrets.CHROME_CLIENT_SECRET || '' }}
          chrome-refresh-token: ${{ env.CHROME == 'true' && secrets.CHROME_REFRESH_TOKEN || '' }}
          chrome-publisher-id: ${{ env.CHROME == 'true' && secrets.CHROME_PUBLISHER_ID || '' }}
          chrome-extension-id: ${{ env.CHROME == 'true' && secrets.CHROME_EXTENSION_ID || '' }}
          chrome-zip-path: ${{ env.CHROME == 'true' && steps.zips.outputs.chrome || '' }}
          chrome-publish: ${{ env.PUBLISH }}

          firefox-api-key: ${{ env.FIREFOX == 'true' && secrets.FIREFOX_JWT_ISSUER || '' }}
          firefox-api-secret: ${{ env.FIREFOX == 'true' && secrets.FIREFOX_JWT_SECRET || '' }}
          firefox-extension-id: ${{ env.FIREFOX == 'true' && 'contact@creeperkatze.de' || '' }}
          firefox-xpi-path: ${{ env.FIREFOX == 'true' && steps.zips.outputs.firefox || '' }}
          firefox-license: AGPL-3.0-only
          firefox-compatibility-firefox: true
          firefox-compatibility-android: true

          edge-api-key: ${{ env.EDGE == 'true' && secrets.EDGE_API_KEY || '' }}
          edge-client-id: ${{ env.EDGE == 'true' && secrets.EDGE_CLIENT_ID || '' }}
          edge-product-id: ${{ env.EDGE == 'true' && secrets.EDGE_PRODUCT_ID || '' }}
          edge-zip-path: ${{ env.EDGE == 'true' && steps.zips.outputs.chrome || '' }}
          edge-publish: ${{ env.PUBLISH }}
