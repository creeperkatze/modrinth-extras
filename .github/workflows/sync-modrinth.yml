name: Sync Modrinth

on:
  schedule:
    - cron: '0 6 * * MON'
  workflow_dispatch:

concurrency:
  group: sync-modrinth
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    name: Update modrinth submodule
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Check for upstream changes
        id: update
        working-directory: modrinth
        run: |
          old_sha=$(git rev-parse HEAD)
          git fetch origin main
          new_sha=$(git rev-parse origin/main)

          if [ "$old_sha" = "$new_sha" ]; then
            echo "No upstream changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git checkout "$new_sha"

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "old_sha=$old_sha" >> "$GITHUB_OUTPUT"
          echo "new_sha=$new_sha" >> "$GITHUB_OUTPUT"
          echo "old_subject=$(git log -1 --format=%s "$old_sha")" >> "$GITHUB_OUTPUT"
          echo "new_subject=$(git log -1 --format=%s "$new_sha")" >> "$GITHUB_OUTPUT"

          {
            echo "commits<<COMMITS_EOF"
            git log --no-merges --pretty=format:'- %s ([`%h`](https://github.com/modrinth/code/commit/%H))' "$old_sha".."$new_sha"
            echo
            echo "COMMITS_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.update.outputs.changed == 'true'

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.update.outputs.changed == 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        id: install
        if: steps.update.outputs.changed == 'true'
        continue-on-error: true
        run: pnpm install --no-frozen-lockfile

      - name: Build (Chrome/Edge)
        id: build-chrome
        if: steps.update.outputs.changed == 'true' && steps.install.outcome == 'success'
        continue-on-error: true
        run: pnpm build

      - name: Build (Firefox)
        id: build-firefox
        if: steps.update.outputs.changed == 'true' && steps.install.outcome == 'success'
        continue-on-error: true
        run: pnpm build:firefox

      - name: Lint
        id: lint
        if: steps.update.outputs.changed == 'true' && steps.install.outcome == 'success'
        continue-on-error: true
        run: pnpm lint

      - name: Open pull request
        if: steps.update.outputs.changed == 'true' && steps.install.outcome == 'success' && steps.build-chrome.outcome == 'success' && steps.build-firefox.outcome == 'success' && steps.lint.outcome == 'success'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GH_PAT }}
          commit-message: 'chore: update modrinth submodule to ${{ steps.update.outputs.new_sha }}'
          branch: sync/modrinth
          delete-branch: true
          title: 'chore: update Modrinth submodule'
          labels: dependencies
          body: |
            Bumps the Modrinth submodule from "${{ steps.update.outputs.old_subject }}" ([`${{ steps.update.outputs.old_sha }}`](https://github.com/modrinth/code/commit/${{ steps.update.outputs.old_sha }})) to "${{ steps.update.outputs.new_subject }}" ([`${{ steps.update.outputs.new_sha }}`](https://github.com/modrinth/code/commit/${{ steps.update.outputs.new_sha }})).

            Upstream commits:
            ${{ steps.update.outputs.commits }}

            [Compare changes](https://github.com/modrinth/code/compare/${{ steps.update.outputs.old_sha }}...${{ steps.update.outputs.new_sha }})

            `pnpm lint`, `pnpm build` and `pnpm build:firefox` all passed against the new submodule commit.

      - name: Open issue on build failure
        if: steps.update.outputs.changed == 'true' && (steps.install.outcome == 'failure' || steps.build-chrome.outcome == 'failure' || steps.build-firefox.outcome == 'failure' || steps.lint.outcome == 'failure')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OLD_SHA: ${{ steps.update.outputs.old_sha }}
          NEW_SHA: ${{ steps.update.outputs.new_sha }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          BUILD_CHROME_OUTCOME: ${{ steps.build-chrome.outcome }}
          BUILD_FIREFOX_OUTCOME: ${{ steps.build-firefox.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
        with:
          script: |
            const label = 'sync-modrinth-failure'
            const title = 'chore: modrinth submodule sync is failing'
            const { OLD_SHA, NEW_SHA, INSTALL_OUTCOME, BUILD_CHROME_OUTCOME, BUILD_FIREFOX_OUTCOME, LINT_OUTCOME } = process.env
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`

            const failedSteps = [
              ['Install dependencies', INSTALL_OUTCOME],
              ['Build (Chrome/Edge)', BUILD_CHROME_OUTCOME],
              ['Build (Firefox)', BUILD_FIREFOX_OUTCOME],
              ['Lint', LINT_OUTCOME],
            ]
              .filter(([, outcome]) => outcome === 'failure')
              .map(([name]) => `- ${name}`)
              .join('\n')

            const body = [
              `The scheduled [sync-modrinth.yml](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/blob/main/.github/workflows/sync-modrinth.yml) run failed while updating the \`modrinth\` submodule from [\`${OLD_SHA}\`](https://github.com/modrinth/code/commit/${OLD_SHA}) to [\`${NEW_SHA}\`](https://github.com/modrinth/code/commit/${NEW_SHA}).`,
              '',
              'Failed steps:',
              failedSteps,
              '',
              `[Compare changes](https://github.com/modrinth/code/compare/${OLD_SHA}...${NEW_SHA}) · [Run logs](${runUrl})`,
              '',
              'No pull request was opened.',
            ].join('\n')

            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: 'd93f0b',
                description: 'The scheduled modrinth submodule sync failed to build',
              })
            } catch (error) {
              if (error.status !== 422) throw error
            }

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            })

            if (existing.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              })
            }
